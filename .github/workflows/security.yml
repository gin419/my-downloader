name: Security Scan

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  # Merge gate without a PR (2026-11-19 rule): gh workflow run <file> --ref <branch>
  workflow_dispatch:
  workflow_call:   # allows release.yml (and others) to call this workflow

jobs:
  # ── Layer 1: project-specific rules ─────────────────────────────────────────
  layer1:
    name: "Layer 1 — Project rules"
    # Sheffield by default. When called from release.yml (github.workflow is the
    # caller's name there) keep the original hosted Linux runner, unchanged.
    runs-on: ${{ fromJSON(github.workflow == 'Release' && '["ubuntu-latest"]' || '["self-hosted","sheffield"]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits

      - name: Install gitleaks
        if: runner.os == 'Linux'
        run: |
          VERSION=$(curl -sf "https://api.github.com/repos/gitleaks/gitleaks/releases/latest" \
            -H "Authorization: Bearer ${{ github.token }}" \
            | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Install gitleaks (macOS, Homebrew)
        if: runner.os != 'Linux'
        run: command -v gitleaks >/dev/null || brew install gitleaks

      - name: "Scan — full history (push / release)"
        run: |
          gitleaks detect \
            --config .github/gitleaks/layer1-rules.toml \
            --source . \
            --redact \
            --verbose

  # ── Layer 2: community rules (auto-updated weekly) ──────────────────────────
  layer2:
    name: "Layer 2 — Community rules"
    # Sheffield by default. When called from release.yml (github.workflow is the
    # caller's name there) keep the original hosted Linux runner, unchanged.
    runs-on: ${{ fromJSON(github.workflow == 'Release' && '["ubuntu-latest"]' || '["self-hosted","sheffield"]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        if: runner.os == 'Linux'
        run: |
          VERSION=$(curl -sf "https://api.github.com/repos/gitleaks/gitleaks/releases/latest" \
            -H "Authorization: Bearer ${{ github.token }}" \
            | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Install gitleaks (macOS, Homebrew)
        if: runner.os != 'Linux'
        run: command -v gitleaks >/dev/null || brew install gitleaks

      - name: "Scan — full history (push / release)"
        run: |
          gitleaks detect \
            --config .github/gitleaks/layer2-config.toml \
            --source . \
            --redact \
            --verbose
