name: Build

on:
  push:
    branches: [main]
  pull_request:  # all bases, so stacked PRs get CI too

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so build.sh can stamp the version from the git tag

      - name: Select Xcode
        # Needs the macOS 15.4 SDK (NSPasteboard.accessBehavior) → Xcode 16.3+.
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Lint (swift-format)
        run: swift format lint --strict --recursive Sources Tests

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Build (release, universal)
        # Two --triple builds (build.sh merges them with lipo); --arch would
        # need full Xcode's XCBuild, which CLT-only dev machines lack.
        run: |
          swift build -c release --triple arm64-apple-macosx
          swift build -c release --triple x86_64-apple-macosx

      # Exercise build.sh end-to-end (bundling + tag version-stamping) without publishing.
      - name: Bundle smoke test
        run: |
          ./build.sh release
          # Bundle structure + universal (arm64 + x86_64) assertions live in the
          # shared gate script, also used by release.yml before signing.
          scripts/verify-universal.sh build/XDownloader.app
          echo "Stamped version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/XDownloader.app/Contents/Info.plist)"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" build/XDownloader.app/Contents/Info.plist >/dev/null
