name: Release

# Trigger by pushing a 3-segment SemVer tag: git tag v1.5.0 && git push origin v1.5.0
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# ─────────────────────────────────────────────────────────────────────────────
# Required repository Secrets (Settings ▸ Secrets and variables ▸ Actions).
# NAMES ONLY below — never paste the values anywhere in the repo.
#
#   Auto-update signing (already in use):
#     SPARKLE_ED_PRIVATE_KEY          Sparkle EdDSA private key; signs the update zip.
#
#   Developer ID code signing (cert imported into a temporary keychain):
#     DEVELOPER_ID_CERT_P12_BASE64    base64 of the "Developer ID Application" cert
#                                     + private key exported as a .p12
#                                     (base64 -i cert.p12 | pbcopy).
#     DEVELOPER_ID_CERT_PASSWORD      the password protecting that .p12 export.
#     KEYCHAIN_PASSWORD               any throwaway password for the ephemeral
#                                     CI keychain created/destroyed each run.
#
#   Notarization (App Store Connect API key — notarytool --key/--key-id/--issuer):
#     APP_STORE_CONNECT_KEY_BASE64    base64 of the AuthKey_XXXX.p8 file
#                                     (base64 -i AuthKey_XXXX.p8 | pbcopy).
#     APP_STORE_CONNECT_KEY_ID        the key's Key ID (e.g. ABC123DEF4).
#     APP_STORE_CONNECT_ISSUER_ID     the App Store Connect issuer UUID.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── Step 1: security must pass before anything is built or published ─────────
  security:
    name: Security scan
    uses: ./.github/workflows/security.yml

  # ── Step 2: build, sign, notarize the macOS app and publish a GitHub Release ─
  build-and-release:
    name: Build & publish
    needs: security          # blocked until both security layers pass
    runs-on: macos-15
    permissions:
      contents: write        # needed to create the GitHub Release
    # Serialize releases: the cumulative appcast lives on one gh-pages branch, so
    # two release runs must not update it at once (a non-fast-forward push would
    # drop one release from the feed). cancel-in-progress:false = queue, never
    # cancel a release mid-flight.
    concurrency:
      group: release-appcast
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Parse "v1.2.3" → VERSION=1.2.3, BUILD=<run number>
      - name: Parse version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG"                       >> "$GITHUB_ENV"
          echo "VERSION=$VERSION"               >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "ASSET=XDownloader-${TAG}.zip"   >> "$GITHUB_ENV"

      # Stamp the version from the tag into the app bundle's Info.plist.
      # This runs before the build so the binary carries the correct version.
      - name: Stamp version into Info.plist
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString ${{ env.VERSION }}" \
            -c "Set :CFBundleVersion ${{ env.BUILD }}" \
            Resources/Info.plist
          echo "Stamped version ${{ env.VERSION }} (build ${{ env.BUILD }})"

      - name: Select Xcode
        # Needs the macOS 15.4 SDK (NSPasteboard.accessBehavior) → Xcode 16.3+.
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build release binary (universal)
        # arm64 + x86_64: macos-15 runners are Apple Silicon, and a host-arch
        # build shipped v1.9.2 unable to launch on Intel Macs. Two --triple
        # builds (build.sh merges them with lipo) instead of --arch, which
        # delegates to XCBuild and fails on CLT-only machines without Xcode.
        run: |
          swift build -c release --triple arm64-apple-macosx
          swift build -c release --triple x86_64-apple-macosx

      # Assemble the bundle. No Developer ID cert is in the keychain yet, so
      # build.sh takes its ad-hoc path here; the authoritative Developer ID sign
      # is the explicit step below (after the cert is imported). build.sh also
      # re-stamps CFBundleVersion from the tag (MAJOR*10000+MINOR*100+PATCH) so
      # it matches the appcast's sparkle:version.
      - name: Create app bundle
        run: ./build.sh release

      # Regression guard: a non-universal bundle must never reach signing.
      - name: Verify universal bundle (arm64 + x86_64)
        run: scripts/verify-universal.sh build/XDownloader.app

      # Import the Developer ID Application cert into a throwaway keychain so
      # codesign can use its private key non-interactively. The keychain is
      # created here and destroyed in the always()-cleanup step at the end.
      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_CERT_P12_BASE64" ]; then
            echo "::error::DEVELOPER_ID_CERT_P12_BASE64 secret is not set — cannot sign."
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/xdownloader-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          printf '%s' "$DEVELOPER_ID_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          # Fresh keychain, unlocked, with a long enough lock timeout to outlast
          # notarization; add it to the search list so codesign finds the identity.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Prepend the temp keychain to the search list (keeping the defaults).
          EXISTING=$(security list-keychains -d user | sed -e 's/[" ]//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "::error::no 'Developer ID Application' identity found after import."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY"     >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"
          echo "Imported: $IDENTITY"

      # Developer ID sign, inside-out: Sparkle's nested code (XPC services,
      # Autoupdate, Updater.app, framework) then the main app — hardened runtime,
      # secure timestamp, entitlements. CODESIGN_IDENTITY comes from the step above.
      - name: Sign (Developer ID + hardened runtime)
        run: scripts/sign-notarize.sh sign build/XDownloader.app

      # Notarize the SIGNED app and staple the ticket. notarytool authenticates
      # with the App Store Connect API key; the .app is zipped for submission and
      # the ticket is stapled back onto the bundle. After this the bundle is
      # notarized on disk — Gatekeeper accepts it offline.
      - name: Notarize + staple
        env:
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: scripts/sign-notarize.sh notarize build/XDownloader.app

      # Verify the final bundle: valid signature + accepted by Gatekeeper (spctl
      # now passes because the ticket is stapled).
      - name: Verify signed + notarized bundle
        run: scripts/sign-notarize.sh verify build/XDownloader.app

      # Archive the STAPLED app. This runs AFTER notarize+staple so the zip — the
      # single artifact used for BOTH the GitHub Release asset and the Sparkle
      # EdDSA signature below — contains the notarized, stapled bundle. ditto
      # preserves macOS metadata better than plain zip.
      - name: Archive stapled app bundle
        run: |
          ditto -c -k --keepParent build/XDownloader.app "${{ env.ASSET }}"
          echo "Archive size: $(du -sh ${{ env.ASSET }} | cut -f1)"

      # Publish the Release (and upload the stapled .zip) BEFORE advertising it in
      # the feed — otherwise the appcast's enclosure URL would 404 until this step
      # runs. The zip stays a Release asset; the feed lives on gh-pages.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "XDownloader ${{ env.TAG }}"
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: ${{ env.ASSET }}
          body: |
            ## Install

            1. Download **`${{ env.ASSET }}`** below
            2. Unzip and drag **XDownloader.app** to `/Applications`
            3. Double-click to open — the app is **signed with a Developer ID and notarized by Apple**, so it launches normally with no Gatekeeper warning

            ## Requirements

            The app checks for missing tools on launch and can install them for you, or run manually:

            ```bash
            brew install yt-dlp gallery-dl ffmpeg
            ```

      # EdDSA-sign the STAPLED archive and fold it into the CUMULATIVE appcast on
      # the gh-pages branch. A cumulative feed at a stable URL (not a single-item
      # feed behind the moving "latest" alias) means the newest version is always
      # advertised, whatever order releases are published in. Runs after the
      # Release above so the enclosure URL already resolves. Because ${{ env.ASSET }}
      # is the notarized+stapled zip, the EdDSA signature covers the exact bytes
      # users download and auto-update installs.
      - name: Update cumulative appcast on gh-pages
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set — updates cannot be signed."
            exit 1
          fi
          SPARKLE_BIN=$(find .build/artifacts -type d -name bin | head -1)
          # --ed-key-file - reads the key from stdin: it never touches disk.
          SIG_ATTRS=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" \
            | "$SPARKLE_BIN/sign_update" --ed-key-file - "${{ env.ASSET }}")
          IFS=. read -r V_MAJOR V_MINOR V_PATCH <<<"${{ env.VERSION }}"
          # 10# forces base 10 so a zero-padded segment (e.g. 08) is not read as octal.
          NUMERIC=$((10#$V_MAJOR * 10000 + 10#$V_MINOR * 100 + 10#$V_PATCH))
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          PAGES=pages

          # The concurrency group above already serializes releases; this
          # clone → rebuild → push loop is defence-in-depth for any concurrent
          # gh-pages write. build_appcast.py is cumulative AND idempotent, so
          # rebuilding on the freshly-cloned feed and re-pushing always converges
          # (each attempt re-reads the latest feed, re-adds only this version).
          for attempt in 1 2 3 4 5; do
            rm -rf "$PAGES"
            if git clone --branch gh-pages --single-branch --depth 1 "$REPO_URL" "$PAGES" 2>/dev/null; then
              EXISTING="$PAGES/appcast.xml"
            else
              echo "gh-pages branch not found — bootstrapping it."
              mkdir -p "$PAGES"
              git -C "$PAGES" init -q
              git -C "$PAGES" checkout -q -b gh-pages
              git -C "$PAGES" remote add origin "$REPO_URL"
              EXISTING=""
            fi

            # EXISTING is "" when bootstrapping; build_appcast.py treats a missing
            # or empty path as an empty feed.
            python3 scripts/build_appcast.py \
              --existing "$EXISTING" \
              --version "${{ env.VERSION }}" \
              --numeric "$NUMERIC" \
              --notes-link "https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG }}" \
              --enclosure-url "https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/${{ env.ASSET }}" \
              --sig-attrs "$SIG_ATTRS" \
              --pub-date "$PUB_DATE" \
              --output "$PAGES/appcast.xml"

            # Fail loudly if the generated feed is malformed rather than publish a
            # broken appcast that would break every client's update check.
            xmllint --noout "$PAGES/appcast.xml"

            git -C "$PAGES" add appcast.xml
            git -C "$PAGES" -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "appcast: ${{ env.TAG }}"
            if git -C "$PAGES" push -q origin HEAD:gh-pages; then
              echo "appcast published (attempt $attempt):"
              cat "$PAGES/appcast.xml"
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::could not publish appcast after 5 attempts."
              exit 1
            fi
            echo "gh-pages push rejected — another release updated it; retrying ($attempt)."
            sleep $((attempt * 3))
          done

      # Destroy the ephemeral signing keychain whatever happened above, so the
      # imported private key never lingers on the runner.
      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
            echo "Deleted signing keychain."
          fi
