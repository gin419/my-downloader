title = "XDownloader — Layer 1: Project-Specific Rules"

# Layer 1 checks project-specific and macOS-specific patterns only.
# It does NOT extend the default gitleaks ruleset — that is Layer 2.
# For broad community secret detection, see layer2-rules.toml.

# ── Paths & PII ────────────────────────────────────────────────────────────────

[[rules]]
id = "hardcoded-local-path"
description = "Hardcoded macOS local user home path"
regex = '''/Users/[A-Za-z][A-Za-z0-9._-]+/(Downloads|Desktop|Documents|Library|Movies|Music|Pictures|Developer|Repos?|Projects?|src)'''
message = "Hardcoded /Users/<name>/ path — use FileManager.homeDirectoryForCurrentUser instead."
severity = "warning"
tags = ["pii", "path", "macos"]

  [rules.allowlist]
  description = "CI runner and placeholder paths are safe"
  regexes = ['''/Users/(runner|github|actions|example|test|dummy)/''']

[[rules]]
id = "personal-email"
description = "Personal email address in committed file"
regex = '''[a-zA-Z0-9._%+\-]{2,}@(gmail|yahoo|hotmail|outlook|icloud|me|mac|proton|pm)\.(com|net|me)'''
message = "Personal email address found — verify this is intentional."
severity = "error"
tags = ["pii", "email"]

  [rules.allowlist]
  description = "Placeholder/example emails are fine"
  regexes = [
    '''(example|test|user|sample|noreply|no-reply|placeholder)@''',
    '''@example\.(com|org|net)''',
    '''@users\.noreply\.github\.com''',
  ]

# ── Credentials & Keys ─────────────────────────────────────────────────────────

[[rules]]
id = "pem-private-key"
description = "PEM private key block"
regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
severity = "critical"
tags = ["crypto", "private-key"]

[[rules]]
id = "hardcoded-password"
description = "Hardcoded password in assignment"
regex = '''(?i)(?:password|passwd|pwd|secret)\s*[:=]\s*["'][^"']{4,}["']'''
severity = "error"
tags = ["credential", "password"]

  [rules.allowlist]
  description = "Placeholder password values"
  regexes = [
    '''(?i)[:=]\s*["'](?:password|changeme|YOUR_PASSWORD|<password>|example|xxx+|\.\.\.|\*+)["']''',
  ]

[[rules]]
id = "hardcoded-token"
description = "Hardcoded bearer or API token in source"
regex = '''(?i)(?:bearer|token|api[_-]?key|access[_-]?key)\s*[:=]\s*["'][A-Za-z0-9\-_.]{16,}["']'''
severity = "critical"
tags = ["credential", "token"]

# ── macOS-Specific ─────────────────────────────────────────────────────────────

[[rules]]
id = "macos-keychain-extraction"
description = "macOS keychain password extraction via security command"
regex = '''security\s+find-(?:generic|internet)-password.*-[wW]\b'''
severity = "critical"
tags = ["credential", "macos", "keychain"]

[[rules]]
id = "macos-defaults-write-secret"
description = "Sensitive value written to UserDefaults via defaults command"
regex = '''defaults\s+write\s+\S+\s+(?i)(?:password|secret|token|key)\s+\S+'''
severity = "warning"
tags = ["credential", "macos", "userdefaults"]

# ── Project-Specific ───────────────────────────────────────────────────────────

[[rules]]
id = "example-download-path-in-comment"
description = "Real local download path in a code comment (exposes username + downloaded content)"
regex = '''//.*?/Users/[A-Za-z][A-Za-z0-9._-]+/'''
message = "Real local path found in a comment — replace with a generic example path."
severity = "warning"
tags = ["pii", "path", "comment"]

  [rules.allowlist]
  regexes = ['''/Users/(runner|example|test)/''']

# ── Global Allowlist ───────────────────────────────────────────────────────────

[allowlist]
description = "Files that are known-safe to skip"
paths = [
  '''(?:^|/)\.github/gitleaks/layer[12]-(?:rules|config)\.toml$''',
  '''(?:^|/)security/layer[12]-rules\.toml$''',
  '''\.github/workflows/update-security-rules\.yml''',
]
# Historical commits that contain /Users/gin/ in code comments (removed in later commits)
commits = [
  "00127a57965529adf302018cb565ef3e06ad8d7f",
  "9fd87f863cf869f8db6de41b956d65195843b3c8",
]
